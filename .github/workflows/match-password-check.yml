name: Match Password Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: 'true'
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Match
        run: gem install fastlane --version 2.241.0 --no-document
      - name: Check certificate decryption only
        env:
          AUTH_VAL: ${{ secrets.GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          CERT_REPO: ${{ secrets.GIT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf "$RUNNER_TEMP/match-password-check"' EXIT
          if [[ "$AUTH_VAL" == ghp_* || "$AUTH_VAL" == github_pat_* ]]; then
            AUTH_VAL="$(printf 'x-access-token:%s' "$AUTH_VAL" | base64 | tr -d '\r\n')"
          fi
          echo "::add-mask::$AUTH_VAL"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_VAL" clone --quiet --depth 1 --single-branch --branch certificates "${CERT_REPO:-https://github.com/poolsoft/kmbbMobileApp.git}" "$RUNNER_TEMP/match-password-check"
          ruby <<'RUBY'
          require 'match'
          directory = File.join(ENV.fetch('RUNNER_TEMP'), 'match-password-check')
          files = Dir[File.join(directory, '**', '*.{cer,p12,mobileprovision,provisionprofile}')]
          abort('No certificate files found; password was not tested.') if files.empty?
          Match::Encryption::OpenSSL.new(working_directory: directory).decrypt_files
          puts 'MATCH_PASSWORD verified: all certificate files decrypted successfully.'
          RUBY
