name: iOS TestFlight ve App Store Dagitimi

on:
  workflow_dispatch:
    inputs:
      hedef:
        description: 'Dagitim Hedefi'
        required: true
        default: 'testflight'
        type: choice
        options:
          - testflight
          - private_release

concurrency:
  group: ios-release
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      FASTLANE_NON_INTERACTIVE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Gerekli secret degerlerini dogrula
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          GIT_BASIC_AUTHORIZATION: ${{ secrets.GIT_BASIC_AUTHORIZATION }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        shell: bash
        run: |
          missing=0
          for name in APPLE_ID APPLE_PASSWORD APP_STORE_CONNECT_API_KEY_ISSUER_ID APP_STORE_CONNECT_API_KEY_KEY APP_STORE_CONNECT_API_KEY_KEY_ID GIT_BASIC_AUTHORIZATION MATCH_PASSWORD TEAM_ID; do
            value="${!name}"
            if [[ -z "$value" || "$value" == "-" ]]; then
              echo "::error::${name} secret degerini Settings > Secrets and variables > Actions altindan girin."
              missing=1
            fi
          done
          exit "$missing"

      - name: Ozel Depodan (kmbbMobileApp) Kodu Klonla
        env:
          AUTH_VAL: ${{ secrets.GIT_BASIC_AUTHORIZATION }}
        run: |
          if [[ "$AUTH_VAL" == ghp_* || "$AUTH_VAL" == github_pat_* ]]; then
            AUTH_VAL="$(printf 'x-access-token:%s' "$AUTH_VAL" | base64 | tr -d '\r\n')"
          fi
          echo "::add-mask::$AUTH_VAL"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH_VAL"
          git clone --branch flutter --single-branch https://github.com/poolsoft/kmbbMobileApp.git .

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Ruby ve Fastlane Kurulumu
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios

      - name: CocoaPods Kurulumu ve Dogrulama
        run: |
          gem install cocoapods
          pod --version

      - name: Flutter Bagimliliklarini Yukle
        run: |
          flutter pub get
          cd ios && pod install

      - name: Fastlane ile Sertifikalari Esitle ve IPA Uret
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
          FASTLANE_USER: ${{ secrets.APPLE_ID }}
          FASTLANE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_BASIC_AUTHORIZATION: ${{ secrets.GIT_BASIC_AUTHORIZATION }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_IDENTIFIER: ${{ secrets.APP_IDENTIFIER }}
          GIT_URL: ${{ secrets.GIT_URL }}
        run: |
          export GIT_URL="${GIT_URL:-https://github.com/poolsoft/kmbbMobileApp.git}"
          export MATCH_READONLY="false"
          cd ios
          bundle exec fastlane build_release_ipa

      - name: Fastlane ile TestFlight'a Yukle
        if: ${{ github.event.inputs.hedef == 'testflight' }}
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_KEY }}
        run: |
          cd ios
          bundle exec fastlane upload_testflight

      - name: IPA Ciktisini Ozel Depoya (kmbbMobileApp) Release Olarak Yukle
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GIT_BASIC_AUTHORIZATION }}
        run: |
          COMMIT_COUNT=$(git rev-list --count HEAD)
          TAG_NAME="v4.0.${COMMIT_COUNT}"
          IPA_FILE=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1)
          if [ -n "$IPA_FILE" ] && [ -f "$IPA_FILE" ]; then
            echo "Private depoya release yukleniyor: $TAG_NAME"
            gh release create "$TAG_NAME" "$IPA_FILE" \
              --repo poolsoft/kmbbMobileApp \
              --title "Surum $TAG_NAME" \
              --notes "Otomatik iOS derlemesi (IPA)." || \
            gh release upload "$TAG_NAME" "$IPA_FILE" --repo poolsoft/kmbbMobileApp --clobber
          fi
